services:
  mddp-app:
    build: .
    container_name: mddp_app
    restart: unless-stopped
    # Privileged mode & USB device mapping for physical Advantech USB-4716 DAQ hardware (Linux Host)
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    # Device mapping for physical RS-232 / USB serial dispenser controllers (Uncomment if needed)
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    ports:
      - "8080:8080" # Portal Gateway
      - "8081:8081" # DAQ Control Panel
      - "8083:8083" # Musashi IV Panel
      - "8084:8084" # Database Plotter Service

  # Optional Test Plugins (TimescaleDB & Mosquitto MQTT Broker)
  # Uncomment the services below if running local database / broker containers
  #
