services:
  influxdb:
    image: influxdb:2
    container_name: mddp-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin1234}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-mddp}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-daq_telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-0}
    volumes:
      - influxdb2_data:/var/lib/influxdb2
      - influxdb2_config:/etc/influxdb2

volumes:
  influxdb2_data:
  influxdb2_config:
